<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Coffee Shop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Coffee Shop</h1>

    <section>
        <h2>Menu</h2>
        <ul id="menu-list"></ul>
    </section>

    <section>
        <h2>Add a Custom Item</h2>

        <input type="text" id="item-name" placeholder="Item name">

        <input type="text" id="item-price" placeholder="Price">

        <button id="add-custom-button">Add to Menu</button>

        <p id="error-message"></p>
    </section>

    <section>
        <h2>Cart (<span id="cart-count">0</span> Items)</h2>

        <ul id="cart-list"></ul>

        <p>
            Total: $<span id="cart-total">0.00</span>
        </p>

        <p id="reward-msg" class="hidden">
            Free cookie unlocked!
        </p>

        <button id="clear-cart-btn">Clear Cart</button>
    </section>

    <script src="script.js"></script>

</body>
</html>
